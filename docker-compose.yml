# Docker Compose 설정
# version: '3.5' 제거 (더 이상 사용되지 않음)

services:
  # Milvus 백엔드 서비스
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/etcd:/etcd
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/logs/etcd:/var/log/etcd
    command: /bin/sh -c "chmod -R 700 /etcd && etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd_init
    networks:
      - rag_network
    profiles:
      - all
      - rag-only
      - db-only

  # etcd 서비스 시작 전 권한 설정을 위한 초기화 서비스 추가
  etcd_init:
    container_name: milvus-etcd-init
    image: alpine:latest
    volumes:
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/etcd:/etcd
    command: sh -c "mkdir -p /etcd/member && chmod -R 700 /etcd && echo 'etcd 디렉토리 권한 설정 완료'"
    networks:
      - rag_network
    profiles:
      - all
      - rag-only
      - db-only

  minio:
    container_name: milvus-minio
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/minio:/minio_data
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/logs/minio:/var/log/minio
    command: minio server /minio_data --console-address ":9001" --address ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_network
    profiles:
      - all
      - rag-only
      - db-only

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./milvus/milvus.yaml:/milvus/configs/milvus.yaml
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/milvus:/var/lib/milvus
      - ${MILVUS_DATA_PATH:-/var/lib/milvus-data}/logs/milvus:/var/log/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "minio"
    networks:
      - rag_network
    profiles:
      - all
      - rag-only
      - db-only

  # Nginx 서비스
  nginx:
    image: nginx:latest
    container_name: ${NGINX_CONTAINER_NAME:-milvus-nginx}
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/locations-enabled:/etc/nginx/locations-enabled
      - shared_tmp:/tmp
      - ./volumes/logs/nginx:/var/log/nginx
    ports:
    # 임시 변경 외부에서 가능하게 3000으로 기존 80
      - "12321:80"
    networks:
      - rag_network
    profiles:
      - all
      - rag-only
      - reranker-only
      - prompt-only
      - app-only
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  # RAG 서비스
  rag:
    build: ./rag
    container_name: milvus-rag
    volumes:
      - ./rag:/rag
      - shared_tmp:/tmp
      - ./volumes/logs/rag:/var/log/rag
      - ./models:/rag/models
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - UWSGI_PROTOCOL=fastcgi
      - UWSGI_SOCKET=/tmp/rag.sock
      - UWSGI_CHMOD_SOCKET=666
      - MODEL_PATH=/rag/models/bge-m3
      - TRANSFORMERS_CACHE=/rag/models
      - HF_HOME=/rag/models
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - MAX_GPU_WORKERS=1
      - INSERT_CHUNK_THREADS=10
      - INSERT_DOCUMENT_THREADS=5
      - MAX_DB_CONNECTIONS=20
      - BATCH_SIZE=50
      - EMBEDDING_BATCH_SIZE=50
    depends_on:
      - standalone
    networks:
      - rag_network
    command: uwsgi --ini /rag/uwsgi.ini
    profiles:
      - all
      - rag-only
      - app-only

  # Reranker 서비스 (API Gateway 포함)
  reranker:
    build: ./reranker
    container_name: milvus-reranker
    volumes:
      - ./reranker:/reranker
      - shared_tmp:/tmp
      - ./volumes/logs/reranker:/var/log/reranker
      - ./flashrank:/usr/local/lib/python3.10/site-packages/flashrank
    environment:
      - RERANKER_CONFIG=/reranker/config.json
      - FLASHRANK_MODEL=gte-multilingual-reranker-base
      - FLASHRANK_CACHE_DIR=/reranker/models
      - RAG_ENDPOINT=http://nginx/rag
      - UWSGI_PROTOCOL=fastcgi
      - UWSGI_SOCKET=/tmp/reranker.sock
      - UWSGI_CHMOD_SOCKET=666
      - MAX_GPU_WORKERS=7
    networks:
      - rag_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}  # GPU_COUNT 환경변수로 제어, 기본값은 all
              capabilities: [gpu]
    command: uwsgi --ini /reranker/uwsgi.ini
    profiles:
      - all
      - reranker-only
      - app-only

  # 프롬프트 백엔드 서비스
  prompt:
    build: ./prompt
    container_name: milvus-prompt
    volumes:
      - ./prompt:/prompt
      - shared_tmp:/tmp
      - ./volumes/logs/prompt:/var/log/prompt
    environment:
      - PROMPT_CONFIG=/prompt/config.json
      - RAG_ENDPOINT=http://nginx/rag
      - RERANKER_ENDPOINT=http://nginx/reranker
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - USE_GPU=${USE_GPU}
      - LLM_GATEWAY_ENDPOINT=${LLM_GATEWAY_ENDPOINT:-http://nginx}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama-gpu:11434}
      - VLLM_ENDPOINT=${VLLM_ENDPOINT:-http://vllm:8000}
      - VLLM_MODEL=${VLLM_MODEL:-/app/models/mistralai/Mistral-7B-Instruct-v0.2}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_SERVER_ENDPOINT=${LLM_SERVER_ENDPOINT:-http://llm-server:8000}
      - UWSGI_PROTOCOL=fastcgi
      - UWSGI_SOCKET=/tmp/prompt.sock
      - UWSGI_CHMOD_SOCKET=666
      - RAG_SEARCH_TOP_K=100
      - RERANKER_TOP_K=20
    networks:
      - rag_network
    command: uwsgi --ini /prompt/uwsgi.ini
    profiles:
      - all
      - prompt-only
      - app-only

  # Ollama 서비스 (CPU 버전)
  ollama:
    build: ./ollama
    container_name: milvus-ollama-cpu
    volumes:
      - ./ollama:/app
      - ./volumes/ollama:/root/.ollama
      - ./volumes/logs/ollama:/var/log/ollama
    ports:
      - "11434:11434"
    networks:
      - rag_network
    profiles:
      - all
      - prompt-only
      - ollama-only
      - app-only
      - cpu-only

  # Ollama 서비스 (GPU 버전)
  ollama-gpu:
    build: ./ollama
    container_name: milvus-ollama-gpu
    volumes:
      - ./ollama:/app
      - ./volumes/ollama:/root/.ollama
      - ./volumes/logs/ollama:/var/log/ollama
    ports:
      - "11434:11434"
    networks:
      - rag_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}  # GPU_COUNT 환경변수로 제어, 기본값은 all
              capabilities: [gpu]
    profiles:
      - gpu-only

  # vLLM 서비스 (GPU 버전)
  vllm:
    build: ./vllm
    container_name: milvus-vllm
    volumes:
      - ./vllm:/app
      - ./models:/app/models
      - ./volumes/logs/vllm:/var/log/vllm
    ports:
      - "11435:8000"  # vLLM 기본 포트
    environment:
      - MODEL_PATH=/app/models/mistralai/Mistral-7B-Instruct-v0.2
      - USE_QUANTIZATION=${USE_QUANTIZATION:-true}
      - QUANTIZATION_METHOD=${QUANTIZATION_METHOD:-awq}
      - MAX_MODEL_LEN=4096
      - TRUST_REMOTE_CODE=true
      - GPU_MEMORY_UTILIZATION=0.8  # GPU 메모리 사용률을 80%로 조정
      - MAX_GPU_MEMORY=20GB  # 최대 GPU 메모리 사용량을 20GB로 조정
      - TENSOR_PARALLEL_SIZE=1  # 텐서 병렬 크기 제한
      - MAX_NUM_BATCHED_TOKENS=4096  # 배치 토큰 수를 4096으로 유지
      - MAX_NUM_SEQS=12  # 최대 시퀀스 수를 12로 조정
    networks:
      - rag_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # GPU 1개만 사용
              capabilities: [gpu]
              options:
                memory: 20GB  # GPU 메모리를 20GB로 조정
    profiles:
      - vllm-only
      - gpu-only

  # LLM Server 서비스 (L40S 최적화, Gemma3 12B)
  llm-server:
    build: ./llm-server
    container_name: milvus-llm-server
    volumes:
      - ./llm-server:/app
      - ./models:/app/models
      - ./volumes/logs/llm-server:/var/log/llm-server
    ports:
      - "11436:8000"  # llm-server 전용 포트
    runtime: nvidia            # 이 서비스만 GPU 런타임
    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-1b8ec862-333b-1bd2-4010-35aceefad60b # GPU 1번만 사용
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_PATH=/app/models/gemma3-12b
      - MAX_MODEL_LEN=8192
      - TRUST_REMOTE_CODE=true
      - GPU_MEMORY_UTILIZATION=0.9  # L40S 48GB 중 90% 사용
      - MAX_GPU_MEMORY=40GB  # L40S 최적화
      - TENSOR_PARALLEL_SIZE=1  # 단일 GPU
      - MAX_NUM_BATCHED_TOKENS=8192  # L40S 메모리 여유
      - MAX_NUM_SEQS=24  # 더 많은 동시 요청
    networks:
      - rag_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # GPU 1개만 사용
              device_ids:
                - GPU-1b8ec862-333b-1bd2-4010-35aceefad60b  # 두 번째 GPU UUID
              capabilities: [gpu]
              options:
                memory: 40GB  # L40S GPU 메모리
    profiles:
      - llm-server-only
      - gpu-only

  # Vision 서비스
  vision:
    build: ./vision
    container_name: milvus-vision
    volumes:
      - ./vision:/vision
      - shared_tmp:/tmp
      - ./volumes/logs/vision:/var/log/vision
    environment:
      - VISION_CONFIG=/vision/config.json
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama-gpu:11434}
      - UWSGI_PROTOCOL=fastcgi
      - UWSGI_SOCKET=/tmp/vision.sock
      - UWSGI_CHMOD_SOCKET=666
    networks:
      - rag_network
    command: uwsgi --ini /vision/uwsgi.ini
    profiles:
      - all
      - vision-only
      - app-only
      - gpu-only

  # 통계 수집 서비스
  stats-service:
    build: ./stats
    container_name: milvus-stats-service
    volumes:
      - ./stats:/app
      - ./volumes/logs/stats:/var/log/stats
      - ./volumes/logs/nginx:/var/log/nginx  # nginx 로그 디렉토리 공유
    ports:
      - "9033:5000"  # 외부 9033 포트에서 내부 5000 포트로 매핑
    environment:
      - MYSQL_HOST=stats-db
      - MYSQL_PORT=3306
      - MYSQL_USER=stats_user
      - MYSQL_PASSWORD=stats_password
      - MYSQL_DATABASE=api_stats
      - UWSGI_PROCESSES=3  # 워커 수를 3으로 설정 (1개는 로그 처리, 나머지는 API 처리)
      - LOG_CHECK_INTERVAL=5  # 로그 확인 주기 설정 (5초)
    depends_on:
      - stats-db
    networks:
      - rag_network
    profiles:
      - stats
      - all
      - rag-only
      - reranker-only
      - prompt-only
      - vision-only
      - app-only
      - gpu-only
      - cpu-only
      - ollama-only
      - db-only

  # 통계 데이터베이스 (MySQL)
  stats-db:
    image: mysql:8.0
    container_name: milvus-stats-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=api_stats
      - MYSQL_USER=stats_user
      - MYSQL_PASSWORD=stats_password
    volumes:
      - ./volumes/mysql:/var/lib/mysql
      - ./stats/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - rag_network
    command: --default-authentication-plugin=mysql_native_password
    profiles:
      - stats
      - all
      - rag-only
      - reranker-only
      - prompt-only
      - vision-only
      - app-only
      - gpu-only
      - cpu-only
      - ollama-only
      - db-only

networks:
  rag_network:
    name: rag_network
    external: true

volumes:
  shared_tmp:
    name: ${COMPOSE_PROJECT_NAME:-rag}_shared_tmp 